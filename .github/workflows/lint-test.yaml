# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint-test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}        
          version: "latest"

      # fastuuid 0.14 uses PyO3 0.26 and has no Python 3.15 wheel.
      - name: Enable stable ABI for fastuuid on Python 3.15
        if: matrix.python-version == '3.15'
        run: echo "PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1" >> "$GITHUB_ENV"

      - name: Install the project
        run: uv sync
      - name: Lint
        run: |
          make lint
      - name: Test
        run: |
          uv run pytest tests/ -m "not access_webapi"
    